<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Boses">
  <!-- Maskable: full-bleed ground (no rounded corners — the platform mask
       supplies the shape) with the mark inset to the 80% safe zone so no
       platform mask can clip a caption bar.

       No wordmark here: at launcher size the text would be an illegible smudge
       and would compete with the mark that actually carries the idea. -->
  <rect width="512" height="512" fill="#F6F2EA"/>

  <g transform="translate(256,256) scale(0.66) translate(-256,-256)">
    <rect x="76" y="176" width="360" height="30" rx="15" fill="#211C16"/>

    <rect x="76" y="230" width="146" height="30" rx="15" fill="#211C16"/>
    <rect x="240" y="228" width="86" height="34" fill="#F7E7C4"/>
    <g fill="#A8681A" opacity="0.5">
      <rect x="252" y="228" width="8" height="34"/><rect x="269" y="228" width="8" height="34"/>
      <rect x="286" y="228" width="8" height="34"/><rect x="303" y="228" width="8" height="34"/>
      <rect x="320" y="228" width="6" height="34"/>
    </g>
    <rect x="240" y="228" width="9" height="34" fill="#A8681A"/>
    <rect x="342" y="230" width="94" height="30" rx="15" fill="#211C16"/>

    <rect x="76" y="284" width="234" height="30" rx="15" fill="#211C16"/>
    <rect x="328" y="282" width="86" height="34" fill="#F7E7C4"/>
    <g fill="#A8681A" opacity="0.5">
      <rect x="340" y="282" width="8" height="34"/><rect x="357" y="282" width="8" height="34"/>
      <rect x="374" y="282" width="8" height="34"/><rect x="391" y="282" width="8" height="34"/>
      <rect x="408" y="282" width="6" height="34"/>
    </g>
    <rect x="328" y="282" width="9" height="34" fill="#A8681A"/>

    <!-- the honest coverage rule -->
    <rect x="76" y="356" width="360" height="12" rx="6" fill="#C9BFAE"/>
    <rect x="76" y="356" width="252" height="12" rx="6" fill="#1F4E5F"/>
  </g>
</svg>
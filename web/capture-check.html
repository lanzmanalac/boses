<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Boses — capture check (P2)</title>
<style>
  :root { --bg:#fff; --fg:#111; --muted:#666; --ok:#1a7f37; --bad:#c62828; --warn:#b26a00; --line:#ddd; }
  @media (prefers-color-scheme: dark) { :root { --bg:#111; --fg:#eee; --muted:#999; --line:#333; } }
  body { font: 16px/1.4 system-ui, sans-serif; margin: 0 auto; padding: 16px; max-width: 720px; background: var(--bg); color: var(--fg); }
  button, select { font: inherit; padding: 8px 12px; margin: 4px 4px 4px 0; min-height: 44px; }
  td:last-child { white-space: normal; }
  table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
  td, th { text-align: left; padding: 4px 6px; border-bottom: 1px solid var(--line); }
  .DECODE { color: var(--ok); } .too_short { color: var(--warn); } .snr_below_threshold { color: var(--bad); }
  #status { color: var(--muted); min-height: 1.4em; }
</style>
</head>
<body>
<h1>Capture check</h1>
<p id="status">Dev page for capture.js / noise.js. Not part of the product UI.</p>
<div>
  <select id="file">
    <option value="lesson-clean">lesson-clean.wav</option>
    <option value="lesson-noisy">lesson-noisy.wav</option>
    <option value="noise-only">noise-only.wav</option>
  </select>
  <button id="replay">Replay file through guards</button>
  <button id="mic">Start mic</button>
  <button id="download" disabled>Download log</button>
  <label><input type="checkbox" id="asr"> Show what Whisper hears (loads P1's model; first time needs internet)</label>
</div>
<p id="quality"></p>
<table><thead><tr><th>start</th><th>end</th><th>SNR dB</th><th>result</th><th>Whisper heard</th></tr></thead><tbody id="rows"></tbody></table>

<script type="module">
import { Segmenter, SAMPLE_RATE } from './noise.js';
import { MicCapture } from './capture.js';

const $ = (id) => document.getElementById(id);
const rows = $('rows');
const esc = (t) => String(t).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

// Optional ASR: P1's real engine, one segment at a time, in order.
let engine = null, loading = null, queue = Promise.resolve(), hotwords = [];
function getEngine() { return (loading ??= loadEngine()); }
async function loadEngine() {
  $('status').textContent = 'Loading Whisper…';
  const { WhisperEngine } = await import('./asr.js');
  engine = new WhisperEngine();
  await engine.init((p) => { $('status').textContent = `Loading Whisper… ${Math.round(p * 100)}%`; });
  hotwords = await fetch('../lessons/hotwords/lesson.txt').then((r) => (r.ok ? r.text() : '')).catch(() => '')
    .then((t) => t.split('\n').map((x) => x.trim()).filter(Boolean));
  $('status').textContent = `Whisper ready (${engine.id}).`;
  return engine;
}
// Start loading as soon as the box is ticked, so the model is ready before you speak.
$('asr').addEventListener('change', () => {
  if ($('asr').checked) getEngine().catch((err) => { $('status').textContent = `Whisper failed to load: ${err.message}`; });
});
if ($('asr').checked) $('asr').dispatchEvent(new Event('change')); // box restored ticked after a reload

// P1's engine returns no word confidence, so heard text arrives as gap alternatives.
// When P1 turns a decode into a gap (e.g. word timestamps it could not map),
// the raw text is still on seg.raw: show it, marked, so capture vs. recognition
// problems can be told apart.
const heardText = (seg) => (seg.words ?? []).map((w) => w.text).join(' ') ||
  (seg.gaps ?? []).flatMap((g) => g.reason?.alternatives ?? []).join(' ') ||
  `(${(seg.gaps ?? []).map((g) => g.reason?.kind).join(', ') || 'nothing'}` +
  (seg.raw?.text ? ` — Whisper did hear: "${seg.raw.text}", dropped by asr.js)` : ')');

// Everything shown in the table, kept for 'Download log' (gate result + what Whisper heard).
let entries = [], mode = '';
const show = (seg) => {
  const entry = { startSec: seg.startSec, endSec: seg.endSec, snrDb: seg.snrDb, result: seg.reason ?? 'sent_to_asr' };
  entries.push(entry);
  $('download').disabled = false;
  const r = seg.reason ?? 'DECODE';
  rows.insertAdjacentHTML('beforeend',
    `<tr class="${r}"><td>${seg.startSec.toFixed(2)}</td><td>${seg.endSec.toFixed(2)}</td><td>${seg.snrDb}</td><td>${r}</td><td></td></tr>`);
  const cell = rows.lastElementChild.lastElementChild;
  if (seg.reason) { cell.textContent = '— gap, Whisper never ran'; return; }
  if (!$('asr').checked) return;
  cell.textContent = '…';
  queue = queue.then(async () => {
    const e = await getEngine();
    const t0 = performance.now();
    const out = await e.transcribe(seg.pcm, { startSec: seg.startSec, hotwords, snrDb: seg.snrDb, snrThresholdDb: 0 });
    entry.whisperHeard = heardText(out);
    entry.asrMs = Math.round(performance.now() - t0);
    entry.engine = e.id;
    cell.innerHTML = `${esc(entry.whisperHeard)} <small>(${entry.asrMs} ms)</small>`;
  }).catch((err) => { cell.textContent = `ASR failed: ${err.message}`; });
};
const summary = () => {
  const all = rows.children.length, dec = rows.querySelectorAll('.DECODE').length;
  $('status').textContent = `${all} segments, ${dec} would reach the decoder.`;
};

$('replay').onclick = async () => {
  rows.innerHTML = ''; entries = []; mode = `replay:${$('file').value}`;
  const res = await fetch(`../lessons/sample/${$('file').value}.wav`);
  const buf = await new AudioContext().decodeAudioData(await res.arrayBuffer());
  const off = new OfflineAudioContext(1, Math.ceil(buf.duration * SAMPLE_RATE), SAMPLE_RATE);
  const src = off.createBufferSource(); src.buffer = buf; src.connect(off.destination); src.start();
  const pcm = (await off.startRendering()).getChannelData(0);
  const seg = new Segmenter();
  seg.onSegment(show);
  for (let i = 0; i < pcm.length; i += 2048) seg.push(pcm.subarray(i, i + 2048));
  seg.flush();
  summary();
  window.__lastReplay = { segments: rows.children.length, decoded: rows.querySelectorAll('.DECODE').length };
};

$('download').onclick = () => {
  const report = {
    page: 'capture-check', mode,
    capture: cap?.exportLog?.() ?? lastCaptureLog ?? null,   // device, mic, settings, room floor per segment
    segments: entries,                                       // gate result + what Whisper heard
  };
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([JSON.stringify(report, null, 2)], { type: 'application/json' }));
  a.download = `boses-gate-log-${mode.replace(/[^\w-]/g, '_')}-${new Date().toISOString().slice(0, 19).replace(/:/g, '')}.json`;
  a.click();
  URL.revokeObjectURL(a.href);
};

let cap = null, timer = 0, lastCaptureLog = null;
$('mic').onclick = async () => {
  if (cap) {
    lastCaptureLog = cap.exportLog();
    await cap.stop(); cap = null; clearInterval(timer);
    $('mic').textContent = 'Start mic'; summary(); return;
  }
  rows.innerHTML = ''; entries = []; mode = 'live-mic';
  cap = new MicCapture();
  cap.onSegment(show);
  try { await cap.start(); } catch (e) { $('status').textContent = `Mic failed: ${e.message}`; cap = null; return; }
  $('mic').textContent = 'Stop mic';
  $('status').textContent = 'Stay quiet for 1 second while the room floor calibrates, then talk.';
  timer = setInterval(() => {
    const q = cap.signalQuality();
    $('quality').textContent = `floor ${q.floorDb.toFixed(1)} dB · level ${q.levelDb.toFixed(1)} dB · ` +
      (q.snrDb !== undefined ? `SNR ${q.snrDb.toFixed(1)} dB` : 'SNR —') + (q.speaking ? ' · speaking' : '');
  }, 200);
};
</script>
</body>
</html>

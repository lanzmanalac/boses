<!doctype html>
<html lang="en" data-contrast="high">
<head>
<meta charset="utf-8">
<!-- viewport-fit=cover so the safe-area insets in styles.css do something on
     a notched phone. Do NOT set user-scalable=no: pinch-zoom is an
     accessibility feature and this app's whole premise is legibility. -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Boses — live Taglish captions</title>
<meta name="description" content="On-device live captions for a Filipino classroom lesson, with visible gaps instead of guesses, and a printable study sheet at the end.">
<meta name="theme-color" content="#000000">
<link rel="manifest" href="./manifest.webmanifest">
<meta name="color-scheme" content="dark">
<link rel="stylesheet" href="./styles.css">
<link rel="icon" href="./icon.svg" type="image/svg+xml">
</head>
<body>
<div class="app">

  <!-- ── header ─────────────────────────────────────────────────────────── -->
  <header class="bar no-print">
    <h1 class="brand">Boses<small>Live captions · on-device</small></h1>
    <div class="hud" id="hud"></div>
  </header>

  <!-- ── presentation controls ──────────────────────────────────────────── -->
  <div class="controls no-print" role="group" aria-label="Display settings">
    <label class="control">
      <span>Type size</span>
      <input type="range" id="type-scale" min="0.85" max="2.4" step="0.05"
             value="1" aria-label="Caption type size">
      <output id="type-scale-out">100%</output>
    </label>

    <button class="btn" id="contrast-toggle" aria-pressed="true">
      Contrast: high
    </button>

    <button class="btn" id="follow-toggle" aria-pressed="true">
      Follow newest: on
    </button>
  </div>

  <!-- ── caption stage ──────────────────────────────────────────────────── -->
  <!-- id="stage": the end-class handler looks this up to swap caption view for
       the study sheet. Without it, $('stage') is null and End class throws. -->
  <main class="stage" id="stage">
    <div class="captions" id="captions"></div>

    <div class="jump" id="jump" hidden>
      <button class="btn" id="jump-btn">↓ Jump to newest</button>
    </div>
  </main>

  <!-- ── study sheet (hidden until End class) ───────────────────────────── -->
  <section class="sheet-view" id="sheet-view" hidden>
    <div class="sheet-actions no-print" style="padding:1rem;display:flex;gap:.75rem;flex-wrap:wrap">
      <button class="btn btn-primary" id="print-btn">Print / save as PDF</button>
      <button class="btn" id="back-btn">Back to captions</button>
      <span class="status" id="sheet-status"></span>
    </div>
    <div id="sheet"></div>
  </section>

  <!-- ── bottom bar ─────────────────────────────────────────────────────── -->
  <footer class="foot no-print">
    <button class="btn" id="flag-btn">I missed this</button>
    <button class="btn" id="start-btn">Start lesson</button>
    <button class="btn" id="end-btn" disabled>End class → sheet</button>
    <select id="saved-lessons" aria-label="Saved lessons"></select>
    <button class="btn" id="open-saved-btn">Open saved lesson</button>
    <button class="btn" id="delete-saved-btn">Delete saved lessons</button>
    <span class="spacer"></span>
    <span class="status" id="status" role="status" aria-live="polite"></span>
  </footer>
</div>

<script type="module">
// ── boot ────────────────────────────────────────────────────────────────────
// P3's scope is the shell, the renderer, and the sheet. Other owners' modules
// are resolved lazily and each one is allowed to be missing without taking the
// UI down with it — so the app degrades to a visible message instead of a
// blank screen. capture.js / noise.js (P2) and engine-select.js / store.js (P4)
// are all loaded this way.

import { CaptionRenderer, Presentation, SignalQualityHUD, TYPE_MIN, TYPE_MAX }
  from './captions.js';
import { StudySheet, deriveCoverage } from './sheet.js';
import { DEFAULTS } from './noise.js';

const $ = (id) => document.getElementById(id);
const status = (msg) => { $('status').textContent = msg; };

const presentation = new Presentation();
const captions = new CaptionRenderer($('captions'));
const hud = new SignalQualityHUD($('hud'));
const sheet = new StudySheet($('sheet'));

// ── session state ───────────────────────────────────────────────────────────
// Held here so the sheet can be produced even if storage is unavailable.
const session = {
  id: `s-${Date.now().toString(36)}`,
  startedAt: Date.now(),
  title: 'Lesson',
  segments: [],
  flags: [],
  vocab: [],
  summaryLines: [],
  llmDraft: undefined,
};
let engine = null;
let capturing = false;
let started = false;
/** @type {typeof import('./capture.js') | null} */
let captureModule = null;
let mic = null;      // live MicCapture instance
let bridge = null;   // { onSegment } from connectCapture

// ── P4 and P2 modules ───────────────────────────────────────────────────────
// These are the post-class pass and the noise gate. Each is optional at
// startup: if one is missing the feature degrades rather than the app dying.
// Everything is resolved lazily and failure is reported in the status line.
let confidence = null;   // P4 gateSegment + deriveCoverage + UNVERIFIED_LABEL
let taglish = null;      // P4 tagSegment
let vocabMod = null;     // P4 extractVocab
let summaryMod = null;   // P4 buildSummary
let hotwords = [];       // P2 per-lesson vocabulary list

for (const [name, load] of [
  ['confidence', () => import('./confidence.js')],
  ['taglish', () => import('./taglish.js')],
  ['vocab', () => import('./vocab.js')],
  ['summary', () => import('./summary.js')],
]) {
  try {
    const mod = await load();
    if (name === 'confidence') confidence = mod;
    if (name === 'taglish') taglish = mod;
    if (name === 'vocab') vocabMod = mod;
    if (name === 'summary') summaryMod = mod;
  } catch {
    console.warn(`[boses] ${name}.js not available`);
  }
}

// P2's hotword list. P1's engine biases decoding toward these, which is how
// 'chlorophyll' stops being heard as 'chlorine'. Sent to the engine, never to
// the UI — the UI must not substitute a term the speaker never said.
try {
  const res = await fetch('../lessons/hotwords/lesson.txt');
  if (res.ok) {
    hotwords = (await res.text()).split('\n').map((w) => w.trim().toLowerCase()).filter(Boolean);
  }
} catch { /* no hotword file; the engine simply runs without biasing */ }

// ── flags ───────────────────────────────────────────────────────────────────
// Route through P4's store when it exists; fall back to in-memory so the
// feature is never silently absent.
let store = null;
try {
  store = await import('./store.js');
} catch {
  status('Local storage module not merged yet — this session is in memory only.');
}

function persistFlags(flags) {
  try { store?.saveFlags?.(session.id, flags); } catch { /* non-fatal */ }
}

function asGap(seg) {
  return {
    ...seg,
    words: [],
    gaps: [{ start: seg.start, end: seg.end, reason: { kind: 'low_confidence' } }],
  };
}

function coverageOf(segments) {
  return confidence?.deriveCoverage
    ? confidence.deriveCoverage(segments)
    : deriveCoverage(segments);
}

function setSavedLessonButtonsHidden(hidden) {
  $('saved-lessons').hidden = hidden;
  $('open-saved-btn').hidden = hidden;
  $('delete-saved-btn').hidden = hidden;
}

async function refreshSavedLessons() {
  const sel = $('saved-lessons');
  sel.replaceChildren();
  if (!store?.listSessions) return [];
  try {
    const listed = await store.listSessions();
    for (const row of listed) {
      const opt = document.createElement('option');
      opt.value = row.id;
      opt.textContent = (row.title && String(row.title).trim()) || row.id;
      sel.appendChild(opt);
    }
    return listed;
  } catch {
    return [];
  }
}

// ── engine ──────────────────────────────────────────────────────────────────
// engine-select.js is P4's. If it is absent, fixture mode is unavailable and
// we say so plainly instead of showing a blank screen.
//
// TWO DISTINCT MODES — do not confuse them at the demo:
//   ?fixture=1  replays committed JSON. Instant, offline, no microphone.
//   no flag     opens the real microphone and loads the model. Slower, needs
//               permission, needs a one-time model download.
// Only the second is live captioning. Say which one is on screen.
const params = new URLSearchParams(location.search);
const wantsFixture = params.has('fixture');

let engineIsLive = false;   // true only when a real mic feeds a real model
let stopWhenEnded = null;   // releases the live stream when End class is pressed

// P2 owns this number. Overridable for a noisier room:
//   ?snr=10  or  localStorage 'boses.snrThresholdDb'
let gateSnrThresholdDb = DEFAULTS.snrThresholdDb;
try {
  const q = new URLSearchParams(location.search).get('snr');
  if (q && Number.isFinite(Number(q))) gateSnrThresholdDb = Number(q);
  const saved = Number(localStorage.getItem('boses.snrThresholdDb'));
  if (!q && Number.isFinite(saved) && saved > 0) gateSnrThresholdDb = saved;
} catch { /* no storage */ }

if (wantsFixture) {
  try {
    engine = (await import('./engine-select.js')).default;
    await engine.init?.();
    const id = engine?.id ?? 'fixture';
    $('start-btn').textContent = 'Play recorded lesson';
    status(`Fixture mode — playing recorded segments via ${id}. Not live. No microphone.`);
    hud.render({ online: navigator.onLine, capturing: false, engine: id });
  } catch (err) {
    console.warn('engine-select unavailable', err);
    status('Fixture engine not merged yet — shell is running, captions are idle.');
    hud.render({ online: navigator.onLine, capturing: false,
                 note: 'Fixture engine not available yet (engine-select.js)' });
  }
} else {
  // Live path. Import capture/noise up front so a missing module is a clear
  // message, not a dead Start button.
  try {
    const cap = await import('./capture.js');
    captureModule = cap;
    engine = (await import('./engine-select.js')).default;
    const id = engine?.id ?? 'whisper';
    $('start-btn').textContent = 'Start lesson (live mic)';
    status('Live mode — first run downloads the model (~40 MB). Pre-download before a demo.');
    hud.render({ online: navigator.onLine, capturing: false, engine: id });
  } catch (err) {
    console.warn('live path unavailable', err);
    $('start-btn').disabled = true;
    status('Live capture unavailable. Add ?fixture=1 to play recorded segments instead.');
    hud.render({ online: navigator.onLine, capturing: false,
                 note: `Live path unavailable: ${err.message}` });
  }
}

try {
  const listed = await refreshSavedLessons();
  if (listed[0] && listed[0].endedAt == null) {
    const prev = $('status').textContent;
    status(prev
      ? `${prev} An unfinished lesson is saved.`
      : 'An unfinished lesson is saved.');
  }
} catch { /* listing is optional at boot */ }

// ── controls ────────────────────────────────────────────────────────────────

const scaleInput = $('type-scale');
scaleInput.min = String(TYPE_MIN);
scaleInput.max = String(TYPE_MAX);
scaleInput.value = String(presentation.getScale());
$('type-scale-out').value = `${Math.round(presentation.getScale() * 100)}%`;

scaleInput.addEventListener('input', () => {
  const v = Number(scaleInput.value);
  presentation.setScale(v);
  $('type-scale-out').value = `${Math.round(v * 100)}%`;
});

$('contrast-toggle').addEventListener('click', (e) => {
  const c = presentation.toggleContrast();
  e.currentTarget.textContent = `Contrast: ${c}`;
  e.currentTarget.setAttribute('aria-pressed', String(c === 'high'));
});

$('follow-toggle').addEventListener('click', (e) => {
  const on = !(e.currentTarget.getAttribute('aria-pressed') === 'true');
  e.currentTarget.setAttribute('aria-pressed', String(on));
  e.currentTarget.textContent = `Follow newest: ${on ? 'on' : 'off'}`;
  if (on) captions.scrollToLatest();
});

// Pacing: show the jump affordance only when we have stopped following.
captions.onPacingChange = (following) => {
  $('jump').hidden = following || !started;
};
$('jump-btn').addEventListener('click', () => captions.scrollToLatest());

$('flag-btn').addEventListener('click', () => {
  const span = captions.flagVisible('user_flagged');
  if (!span) { status('Nothing on screen to flag yet.'); return; }
  session.flags = captions.getFlags();
  persistFlags(session.flags);
  status(`Flagged ${formatClock(span.start)} — it will be on the sheet.`);
});

// ── lesson lifecycle ────────────────────────────────────────────────────────

$('start-btn').addEventListener('click', async () => {
  started = true;
  $('end-btn').disabled = false;
  $('start-btn').disabled = true;
  capturing = true;
  setSavedLessonButtonsHidden(true);
  $('sheet-view').hidden = true;
  $('stage').hidden = false;
  hud.render({ online: navigator.onLine, capturing: true, engine: engine?.id ?? 'fixture' });

  let beginError = null;
  try {
    if (store?.beginSession) {
      await store.beginSession({ id: session.id, startedAt: session.startedAt, title: session.title });
    }
  } catch (err) {
    console.warn('session not opened in store', err);
    beginError = err;
    status(`Could not open this lesson in storage. ${err?.message ?? err}. The lesson will continue.`);
  }

  const gateOptions = {
    snrThresholdDb: gateSnrThresholdDb,
    minDurationSec: DEFAULTS.minSpeechSec,
    supportsWordConfidence: engine?.supportsWordConfidence === true,
    repetitionDetected: false,
    wordConfidenceThreshold: 0.55,
  };

  const gateSegment = (seg) => {
    if (!confidence?.gateSegment) {
      status('The caption check failed, so this segment is shown as a gap.');
      return asGap(seg);
    }
    let gated;
    try {
      gated = confidence.gateSegment(seg, {
        ...gateOptions,
        repetitionDetected: seg.repetitionDetected === true,
      });
    } catch (err) {
      console.warn('[boses] gateSegment failed, showing a gap', err);
      status('The caption check failed, so this segment is shown as a gap.');
      return asGap(seg);
    }
    if (taglish?.tagSegment && gated.words?.length) {
      try {
        gated.taglish = taglish.tagSegment(gated, { tlTerms: [], enTerms: [] });
      } catch (err) {
        console.warn('[boses] Taglish tagging failed; keeping gated captions', err);
      }
    }
    return gated;
  };

  const acceptSegment = (raw) => {
    const seg = gateSegment(raw);
    session.segments.push(seg);
    captions.appendSegment(seg);
    Promise.resolve(store?.appendSegment?.(session.id, seg)).catch(() => {});
    hud.render({
      online: navigator.onLine, capturing, engine: engine?.id ?? 'fixture',
      snrDb: seg.snrDb, latencyMs: seg.latencyMs,
    });
  };

  const consume = (bridgeLike) => new Promise((resolve) => {
    bridgeLike.onSegment(acceptSegment);
    resolve();
  });

  try {
    if (wantsFixture) {
      status(beginError
        ? `Playing recorded segments. This is not live capture. Could not open this lesson in storage. ${beginError?.message ?? beginError}.`
        : 'Playing recorded segments. This is not live capture.');
      hud.render({ online: navigator.onLine, capturing: false, engine: engine?.id ?? 'fixture' });
      for await (const raw of streamSegments(engine)) acceptSegment(raw);
      status('Recorded lesson finished. End class to produce the sheet.');
    } else {
      status(beginError
        ? `Requesting microphone. Could not open this lesson in storage. ${beginError?.message ?? beginError}.`
        : 'Requesting microphone…');
      mic = new captureModule.MicCapture({
        snrThresholdDb: gateSnrThresholdDb,
        minSpeechSec: DEFAULTS.minSpeechSec,
      });
      await mic.start();
      engineIsLive = true;

      bridge = captureModule.connectCapture(mic, engine, {
        hotwords,
        snrThresholdDb: gateSnrThresholdDb,
      });
      status(`Listening. Keep this screen on. ${gateSnrThresholdDb} dB.${hotwords.length ? ` Hotwords: ${hotwords.length}.` : ''}${beginError ? ` Could not open this lesson in storage. ${beginError?.message ?? beginError}.` : ''}`);
      hud.render({ online: navigator.onLine, capturing: true, engine: engine.id,
                   ...mic.signalQuality() });

      // While capture runs, keep the HUD honest about the room.
      const qualityTimer = setInterval(() => {
        if (!capturing || !mic) return;
        hud.render({ online: navigator.onLine, capturing: true, engine: engine?.id,
                     ...mic.signalQuality() });
      }, 1000);

      await consume(bridge);             // resolves immediately; segments arrive async
      // Keep streaming until End class is pressed.
      await new Promise((resolve) => { stopWhenEnded = resolve; });
      clearInterval(qualityTimer);
    }
  } catch (err) {
    console.warn('capture stream ended', err);
    capturing = false;
    engineIsLive = false;
    setSavedLessonButtonsHidden(false);
    const denied = /permission|denied|NotAllowed/i.test(err?.message ?? '');
    status(denied
      ? 'Microphone permission denied. Allow it in the browser, or add ?fixture=1 to play recorded segments.'
      : `Capture stopped: ${err?.message ?? err}. Segments captured so far are kept. Add ?fixture=1 for the recorded path.`);
    hud.render({ online: navigator.onLine, capturing: false, engine: engine?.id ?? 'fixture',
                 note: denied ? 'Microphone permission denied' : 'Capture stopped' });
  } finally {
    $('start-btn').disabled = false;
    await mic?.stop().catch(() => {});
    mic = null;
  }
});

$('end-btn').addEventListener('click', async () => {
  $('end-btn').disabled = true;
  capturing = false;
  engineIsLive = false;
  setSavedLessonButtonsHidden(false);
  stopWhenEnded?.();
  stopWhenEnded = null;
  await mic?.stop().catch(() => {});
  mic = null;
  session.segments = captions.getSegments();
  session.flags = captions.getFlags();

  try { session.vocab = vocabMod?.extractVocab?.(session) ?? []; }
  catch (err) { console.warn('vocab extraction failed', err); session.vocab = []; }

  try { session.summaryLines = summaryMod?.buildSummary?.(session) ?? []; }
  catch (err) { console.warn('summary build failed', err); session.summaryLines = []; }

  const coverage = coverageOf(session.segments);
  session.endedAt = Date.now();

  let saveError = null;
  try {
    if (store?.finalizeSession) {
      await store.finalizeSession({ ...session, coverage, endedAt: session.endedAt });
    }
  } catch (err) {
    console.warn('session not persisted', err);
    saveError = err;
  }

  if (!saveError) {
    try { await refreshSavedLessons(); } catch { /* list refresh is optional */ }
  }

  const unverified = engine?.supportsWordConfidence !== true;
  sheet.render({
    session: { ...session, summaryLines: session.summaryLines },
    coverage,
    summaryLines: session.summaryLines,
    llmDraft: session.llmDraft,
    confidenceSource: unverified
      ? (confidence?.UNVERIFIED_LABEL
          ?? 'segment-level reliability (decoder confidence unavailable)')
      : 'per-token decoder confidence',
    unverified,
  });

  $('stage').hidden = true;
  $('sheet-view').hidden = false;
  $('sheet-status').textContent = saveError
    ? `Save failed: ${saveError?.message ?? saveError}`
    : `${Math.round(coverage.coverageRatio * 100)}% of the time is shown as words · ${session.flags.length} flagged`;
  hud.render({ online: navigator.onLine, capturing: false, engine: engine?.id ?? 'fixture' });
  window.scrollTo(0, 0);
});

function finishSaved(saved) {
  let vocab = Array.isArray(saved.vocab) ? saved.vocab : [];
  if (vocab.length === 0) {
    try { vocab = vocabMod?.extractVocab?.(saved) ?? []; }
    catch (err) { console.warn('vocab extraction failed', err); vocab = []; }
  }
  let summaryLines = Array.isArray(saved.summaryLines) ? saved.summaryLines : [];
  if (summaryLines.length === 0) {
    try { summaryLines = summaryMod?.buildSummary?.({ ...saved, vocab }) ?? []; }
    catch (err) { console.warn('summary build failed', err); summaryLines = []; }
  }
  const coverage = saved.coverage ?? coverageOf(saved.segments ?? []);
  return { vocab, summaryLines, coverage };
}

function showSheet(saved, coverage, summaryLines, statusText) {
  const unverified = engine?.supportsWordConfidence !== true;
  sheet.render({
    session: { ...saved, summaryLines },
    coverage,
    summaryLines,
    llmDraft: saved.llmDraft,
    confidenceSource: unverified
      ? (confidence?.UNVERIFIED_LABEL
          ?? 'segment-level reliability (decoder confidence unavailable)')
      : 'per-token decoder confidence',
    unverified,
  });
  $('stage').hidden = true;
  $('sheet-view').hidden = false;
  $('sheet-status').textContent = statusText;
  window.scrollTo(0, 0);
}

$('open-saved-btn').addEventListener('click', async () => {
  if (capturing) return;
  if (!store?.getSession) {
    status('Local storage is not available.');
    return;
  }
  const id = $('saved-lessons').value;
  if (!id) {
    status('No saved lesson is selected.');
    return;
  }
  try {
    const saved = await store.getSession(id);
    if (!saved) {
      status('That saved lesson is missing.');
      return;
    }
    const { vocab, summaryLines, coverage } = finishSaved(saved);
    showSheet(
      { ...saved, vocab, summaryLines },
      coverage,
      summaryLines,
      `${Math.round(coverage.coverageRatio * 100)}% of the time is shown as words · ${(saved.flags ?? []).length} flagged`,
    );
  } catch (err) {
    status(`Could not open the saved lesson: ${err?.message ?? err}`);
  }
});

$('delete-saved-btn').addEventListener('click', async () => {
  if (capturing) return;
  if (!store?.deleteAllSessions) {
    status('Local storage is not available.');
    return;
  }
  try {
    await store.deleteAllSessions();
    await refreshSavedLessons();
    status('Saved lessons are gone.');
  } catch (err) {
    status(`Could not delete saved lessons: ${err?.message ?? err}`);
  }
});

$('print-btn').addEventListener('click', () => sheet.print());

$('back-btn').addEventListener('click', () => {
  $('sheet-view').hidden = true;
  $('stage').hidden = false;
  captions.render();
});

// ── helpers ─────────────────────────────────────────────────────────────────

function formatClock(sec) {
  const m = Math.floor(sec / 60), s = Math.floor(sec % 60);
  return `${m}:${String(s).padStart(2, '0')}`;
}

/**
 * Drive the engine. Capture is P2's and arrives as a callback; until then the
 * engine itself yields segments (fixture mode), so the UI is exercisable.
 */
async function* streamSegments(eng) {
  if (typeof eng.segments === 'function') {
    for (const seg of await eng.segments()) yield seg;
    return;
  }
  if (typeof eng.onSegment === 'function') {
    const queue = [];
    let done = false;
    let notify = () => {};
    eng.onSegment((seg) => { queue.push(seg); notify(); });
    while (!done) {
      if (queue.length) { yield queue.shift(); continue; }
      await new Promise((r) => { notify = r; });
    }
  }
}

// ── connectivity ────────────────────────────────────────────────────────────
// Airplane mode is the expected state, so the HUD reports it as a success.
// Airplane mode is the expected state, so the HUD reports it as a success.
// The mode word is deliberate: "live mic" and "recorded" must never look alike
// on screen, or the demo claims something it is not doing.
const onNet = () => hud.render({
  online: navigator.onLine, capturing, engine: engine?.id ?? 'fixture',
  note: engineIsLive ? 'live microphone'
     : wantsFixture ? 'recorded segments — not live' : undefined,
});
addEventListener('online', onNet);
addEventListener('offline', onNet);

// ── service worker ──────────────────────────────────────────────────────────
// Register with a wider scope first so the worker can also serve
// lessons/fixtures/*.json, which live outside /web/. Hosts that do not send
// `Service-Worker-Allowed` will refuse that; fall back to the default scope
// rather than ending up with no worker at all.
if ('serviceWorker' in navigator) {
  addEventListener('load', async () => {
    const reg = async (scope) =>
      navigator.serviceWorker.register('./sw.js', scope ? { scope } : undefined);

    try {
      try {
        await reg('../');
        console.info('[boses] service worker registered with repo-root scope');
      } catch {
        await reg(); // host refused the wider scope — default is fine
        console.info('[boses] service worker registered at /web scope; ' +
          'offline fixture mode needs Service-Worker-Allowed: / on sw.js');
      }
    } catch (err) {
      // Offline will not work without it; say so rather than pretending.
      console.warn('sw registration failed', err);
      status('Offline cache unavailable — service worker did not register.');
    }
  });
}

// Keep the screen awake if the platform allows it — the session must not sleep
// mid-lesson on a phone propped on a desk.
try {
  if ('wakeLock' in navigator) {
    const request = () => navigator.wakeLock.request('screen').catch(() => {});
    addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible') request();
    });
    $('start-btn').addEventListener('click', request, { once: true });
  }
} catch { /* not supported — harmless */ }
</script>
</body>
</html>
